[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "guard-bands"
version = "0.11.0"
description = "Cryptographic boundaries for separating untrusted LLM content from trusted instructions and tool execution."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "cryptography>=44",
  "rfc8785>=0.1.4,<0.2",
]

[project.optional-dependencies]
fastapi = [
  "fastapi>=0.115",
]
mcp = [
  "mcp>=2,<3",
]
dev = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "hypothesis>=6.100",
  "mcp>=2,<3",
  "mypy>=1.17,<2",
  "pytest>=8",
  "ruff>=0.12,<1",
]

[project.urls]
Homepage = "https://guardbands.com/"
Repository = "https://github.com/Cryptix-Security/guard-bands"
Issues = "https://github.com/Cryptix-Security/guard-bands/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["guardbands*"]

[tool.setuptools.package-data]
guardbands = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "N", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = [
  "src/guardbands/crypto.py",
  "src/guardbands/replay.py",
]
