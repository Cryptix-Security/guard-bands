[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "guard-bands"
version = "0.8.0"
description = "Cryptographic boundaries for separating untrusted LLM content from trusted instructions and tool execution."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "cryptography>=44",
]

[project.optional-dependencies]
fastapi = [
  "fastapi>=0.115",
]
dev = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "hypothesis>=6.100",
  "pytest>=8",
]

[project.urls]
Homepage = "https://guardbands.com/"
Repository = "https://github.com/Cryptix-Security/guard-bands"
Issues = "https://github.com/Cryptix-Security/guard-bands/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["guardbands*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
